spec:
  kafka:
    pool: nav-prod
  prometheus:
    enabled: true
  gcp:
    sqlInstances:
      - type: POSTGRES_15
        tier: db-custom-1-3840
        diskAutoresize: true
        databases:
          - name: spinosaurus
            users:
              - name: spinosaurus_datastream_bruker
        flags:
          - name: cloudsql.logical_decoding
            value: "on"
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  accessPolicy:
    outbound:
      external:
        - host: oppgave.prod-fss-pub.nais.io
        - host: pdl-api.prod-fss-pub.nais.io
  env:
    - name: KOIN_PROFILE
      value: PROD
    - name: OPPGAVEBEHANDLING_URL
      value: https://oppgave.prod-fss-pub.nais.io/api/v1/oppgaver
    - name: PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io/graphql
    - name: OPPGAVE_SCOPE
      value: api://prod-fss.oppgavehandtering.oppgave/.default
    - name: PDL_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
