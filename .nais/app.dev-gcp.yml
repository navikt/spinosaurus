spec:
  kafka:
    pool: nav-dev
  prometheus:
    enabled: false
  azure:
    application:
      allowAllUsers: false
      claims:
        extra:
          - 'NAVident'
        groups:
          - id: '4373da97-ad06-40c0-893e-98ba4d0aeecb'
  gcp:
    sqlInstances:
      - type: POSTGRES_15
        tier: db-f1-micro
        diskAutoresize: true
        databases:
          - name: spinosaurus
            users:
              - name: spinosaurus_datastream_bruker
        flags:
          - name: cloudsql.logical_decoding
            value: "on"
  ingresses:
    - https://spinosaurus.intern.dev.nav.no
  accessPolicy:
    inbound:
      rules:
        - application: refusjon
        - application: bakrommet
          namespace: speilvendt
    outbound:
      external:
        - host: oppgave-q1.dev-fss-pub.nais.io
        - host: pdl-api.dev-fss-pub.nais.io
  env:
    - name: KOIN_PROFILE
      value: DEV
    - name: OPPGAVEBEHANDLING_URL
      value: https://oppgave-q1.dev-fss-pub.nais.io/api/v1/oppgaver
    - name: PDL_URL
      value: https://pdl-api.dev-fss-pub.nais.io/graphql
    - name: OPPGAVE_SCOPE
      value: api://dev-fss.oppgavehandtering.oppgave-q1/.default
    - name: PDL_SCOPE
      value: api://dev-fss.pdl.pdl-api/.default
